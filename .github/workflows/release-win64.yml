name: Release stable Rive Unreal Win64 plugin

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional published upstream release tag to process'
        required: false
        type: string

concurrency:
  group: stable-win64-release
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      count: ${{ steps.releases.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_TAG: ${{ inputs.upstream_tag }}
      BASELINE_PUBLISHED_AT: '2026-09-22T00:12:57Z'
    steps:
      - name: Discover every unbuilt upstream stable release
        id: releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'jiangxiaoxu/rive-unreal-ci' ]]; then
            echo 'This workflow only publishes from jiangxiaoxu/rive-unreal-ci.' >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_TAG" && ! "$REQUESTED_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Unsupported upstream tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Cannot resolve CI repository main commit.' >&2
            exit 1
          fi
          verify_main_ancestor() {
            local tag_name=$1 tag_sha=$2 comparison
            if ! comparison=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_sha}...${main_sha}" --jq '.status'); then
              echo "Cannot compare tag $tag_name with CI repository main." >&2; return 1
            fi
            if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
              echo "Tag $tag_name does not point to a commit in CI repository main history." >&2; return 1
            fi
          }

          gh api --paginate --slurp 'repos/rive-app/rive-unreal/releases?per_page=100' > "$RUNNER_TEMP/upstream-releases.json"
          jq -e '
            type == "array" and
            all(.[]; type == "array" and all(.[];
              (.id | type) == "number" and
              (.tag_name | type) == "string" and
              (.draft | type) == "boolean" and
              (.prerelease | type) == "boolean" and
              (.published_at == null or (.published_at | type) == "string")
            ))
          ' "$RUNNER_TEMP/upstream-releases.json" >/dev/null
          jq -c --arg baseline "$BASELINE_PUBLISHED_AT" --arg requested "$REQUESTED_TAG" '
            [.[][] |
              select(.draft == false and .prerelease == false and .published_at != null) |
              select(.published_at >= $baseline) |
              select($requested == "" or .tag_name == $requested) |
              {id, tag_name, published_at}
            ] | sort_by(.published_at, .id) | .[]
          ' "$RUNNER_TEMP/upstream-releases.json" > "$RUNNER_TEMP/candidates.jsonl"
          if [[ -n "$REQUESTED_TAG" && ! -s "$RUNNER_TEMP/candidates.jsonl" ]]; then
            echo "No eligible published stable release found for $REQUESTED_TAG." >&2
            exit 1
          fi

          : > "$RUNNER_TEMP/build-matrix.jsonl"
          while IFS= read -r upstream; do
            upstream_id=$(jq -r '.id | tostring' <<< "$upstream")
            upstream_tag=$(jq -r '.tag_name' <<< "$upstream")
            upstream_published_at=$(jq -r '.published_at' <<< "$upstream")
            if [[ ! "$upstream_id" =~ ^[0-9]+$ || ! "$upstream_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Unsupported upstream release identity: $upstream" >&2
              exit 1
            fi

            marker_tag="built-release-$upstream_id"
            marker_status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/built-tag.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${marker_tag}")
            case "$marker_status" in
              200)
                marker_type=$(jq -r '.object.type' "$RUNNER_TEMP/built-tag.json")
                marker_sha=$(jq -r '.object.sha' "$RUNNER_TEMP/built-tag.json")
                if [[ "$marker_type" != commit || ! "$marker_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "Completion marker $marker_tag does not point to a commit." >&2; exit 1
                fi
                verify_main_ancestor "$marker_tag" "$marker_sha"
                echo "Already built upstream release $upstream_id ($upstream_tag)."
                continue
                ;;
              404) ;;
              *) echo "Cannot inspect completion marker $marker_tag (HTTP $marker_status)." >&2; exit 1 ;;
            esac

            # Resolve the upstream release tag itself, including one annotated tag object.
            upstream_ref=$(gh api "repos/rive-app/rive-unreal/git/ref/tags/${upstream_tag}")
            object_type=$(jq -r '.object.type' <<< "$upstream_ref")
            tag_sha=$(jq -r '.object.sha' <<< "$upstream_ref")
            if [[ "$object_type" == tag && "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
              tag_object=$(gh api "repos/rive-app/rive-unreal/git/tags/${tag_sha}")
              object_type=$(jq -r '.object.type' <<< "$tag_object")
              tag_sha=$(jq -r '.object.sha' <<< "$tag_object")
            fi
            if [[ "$object_type" != commit || ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Upstream release tag $upstream_tag does not resolve to a commit." >&2
              exit 1
            fi
            release_tag="stable-$upstream_tag"

            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              api_url=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq '.apiUrl')
              existing=$(gh api "$api_url")
              if [[ "$(jq -r '.prerelease' <<< "$existing")" != false ]]; then
                echo "Stable release $release_tag is unexpectedly marked as prerelease." >&2
                exit 1
              fi
              body=$(jq -r '.body // ""' <<< "$existing")
              refs=$(sed -n 's/^<!-- rive-ci-refs: \(.*\) -->$/\1/p' <<< "$body" | head -n 1)
              if [[ -z "$refs" ]] || ! jq -e . <<< "$refs" >/dev/null; then
                echo "Stable release $release_tag has no valid pinned commit metadata." >&2
                exit 1
              fi
              channel=$(jq -r '.channel // empty' <<< "$refs")
              recorded_tag=$(jq -r '.upstreamTag // empty' <<< "$refs")
              recorded_id=$(jq -r '.upstreamReleaseId // empty' <<< "$refs")
              recorded_date=$(jq -r '.upstreamPublishedAt // empty' <<< "$refs")
              plugin_sha=$(jq -r '.pluginSha // empty' <<< "$refs")
              runtime_sha=$(jq -r '.runtimeSha // empty' <<< "$refs")
              ci_sha=$(jq -r '.ciSha // empty' <<< "$refs")
              if [[ "$channel" != stable || "$recorded_tag" != "$upstream_tag" || "$recorded_id" != "$upstream_id" ||
                    "$recorded_date" != "$upstream_published_at" || "$plugin_sha" != "$tag_sha" ||
                    ! "$runtime_sha" =~ ^[0-9a-f]{40}$ || ! "$ci_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Stable release $release_tag has conflicting pinned metadata." >&2
                exit 1
              fi
              gh api "repos/${GITHUB_REPOSITORY}/commits/${ci_sha}" --jq '.sha' | grep -Fxq "$ci_sha"
              display_status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/display-tag.json" --write-out '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}")
              case "$display_status" in
                200)
                  display_ref=$(cat "$RUNNER_TEMP/display-tag.json")
                  display_type=$(jq -r '.object.type' <<< "$display_ref")
                  display_sha=$(jq -r '.object.sha' <<< "$display_ref")
                  if [[ "$display_type" == tag && "$display_sha" =~ ^[0-9a-f]{40}$ ]]; then
                    display_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${display_sha}")
                    display_type=$(jq -r '.object.type' <<< "$display_object")
                    display_sha=$(jq -r '.object.sha' <<< "$display_object")
                  fi
                  if [[ "$display_type" != commit || ! "$display_sha" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "Stable display tag $release_tag does not point to a commit." >&2
                    exit 1
                  fi
                  verify_main_ancestor "$release_tag" "$display_sha"
                  ;;
                404)
                  if [[ "$(jq -r '.draft' <<< "$existing")" != true ||
                        "$(jq -r '.target_commitish // empty' <<< "$existing")" != main ]]; then
                    echo "Stable release $release_tag has no matching CI tag or draft target." >&2
                    exit 1
                  fi
                  ;;
                *) echo "Cannot inspect stable display tag $release_tag (HTTP $display_status)." >&2; exit 1 ;;
              esac
              if jq -e --arg name 'RiveUnreal-Win64.zip' \
                '[.assets[] | select(.name == $name and .state == "uploaded" and (.size // 0) > 0)] | length > 0' \
                <<< "$existing" >/dev/null; then
                if [[ "$(jq -r '.draft' <<< "$existing")" == true ]]; then
                  gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --target main --draft=false
                fi
                marker_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')
                if [[ ! "$marker_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo 'Cannot resolve CI repository main commit for completion marker.' >&2
                  exit 1
                fi
                gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f "ref=refs/tags/${marker_tag}" -f "sha=$marker_main_sha" >/dev/null
                echo "Repaired completion marker for $release_tag."
                continue
              fi
              echo "Retrying incomplete stable release $release_tag with pinned commits."
            else
              plugin_sha=$tag_sha
              ci_sha=$GITHUB_SHA
            fi

            jq -nc \
              --arg channel stable \
              --arg release_tag "$release_tag" \
              --arg version_name "$upstream_tag" \
              --arg plugin_sha "$plugin_sha" \
              --arg ci_sha "$ci_sha" \
              --arg upstream_tag "$upstream_tag" \
              --arg upstream_release_id "$upstream_id" \
              --arg upstream_published_at "$upstream_published_at" \
              '{
                channel:$channel, release_tag:$release_tag, version_name:$version_name,
                plugin_sha:$plugin_sha, ci_sha:$ci_sha, upstream_tag:$upstream_tag,
                upstream_release_id:$upstream_release_id, upstream_published_at:$upstream_published_at
              }' >> "$RUNNER_TEMP/build-matrix.jsonl"
          done < "$RUNNER_TEMP/candidates.jsonl"

          matrix=$(jq -sc '.' "$RUNNER_TEMP/build-matrix.jsonl")
          count=$(jq 'length' <<< "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending stable releases: $count"

  build:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-win64.yml
    with:
      channel: stable
      release_tag: ${{ matrix.release_tag }}
      version_name: ${{ matrix.version_name }}
      plugin_sha: ${{ matrix.plugin_sha }}
      ci_sha: ${{ matrix.ci_sha }}
      upstream_tag: ${{ matrix.upstream_tag }}
      upstream_release_id: ${{ matrix.upstream_release_id }}
      upstream_published_at: ${{ matrix.upstream_published_at }}

  prune:
    needs: [discover, build]
    if: ${{ always() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RELEASES: '2'
    steps:
      - name: Retain the newest two published stable releases
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/ci-releases.json"
          jq -e '
            type == "array" and
            all(.[]; type == "array" and all(.[];
              (.id | type) == "number" and
              (.draft | type) == "boolean" and
              (.tag_name | type) == "string" and
              (.published_at == null or (.published_at | type) == "string")
            ))
          ' "$RUNNER_TEMP/ci-releases.json" >/dev/null
          jq -r --argjson keep "$KEEP_RELEASES" '
            [.[][] |
              select(.draft == false and .published_at != null and (.tag_name | startswith("stable-"))) |
              . as $release |
              try (
                ((.body // "") | split("\n")[0] |
                  capture("^<!-- rive-ci-refs: (?<json>\\{.*\\}) -->$").json | fromjson) as $refs |
                select($refs.channel == "stable" and
                  ("stable-" + $refs.upstreamTag) == $release.tag_name and
                  ($refs.upstreamReleaseId | test("^[0-9]+$")) and
                  ($refs.upstreamPublishedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))) |
                {
                  tag:$release.tag_name,
                  upstreamPublishedAt:$refs.upstreamPublishedAt,
                  upstreamReleaseId:($refs.upstreamReleaseId | tonumber)
                }
              ) catch empty
            ] |
            sort_by(.upstreamPublishedAt, .upstreamReleaseId) | reverse |
            .[$keep:] | .[] | [.tag, (.upstreamReleaseId | tostring)] | @tsv
          ' "$RUNNER_TEMP/ci-releases.json" > "$RUNNER_TEMP/prune-tags.txt"
          while IFS=$'\t' read -r tag upstream_id; do
            marker_status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/prune-marker.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/built-release-${upstream_id}")
            if [[ "$marker_status" != 200 ]]; then
              echo "Cannot prune $tag without its permanent built-release-$upstream_id marker (HTTP $marker_status)." >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/prune-tags.txt"
          while IFS=$'\t' read -r tag upstream_id; do
            echo "Deleting old stable release and display tag: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < "$RUNNER_TEMP/prune-tags.txt"
